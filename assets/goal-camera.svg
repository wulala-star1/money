<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="camBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#F4ECE1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#5C4533" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#camBg)"/>

  <!-- 桌面木纹与手账贴纸 -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#E2D4C7" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 照片拍立得/底片小插画 -->
  <g transform="translate(60, 95) rotate(-12)" filter="url(#cardShadow)">
    <rect width="80" height="96" rx="6" fill="#FFFFFF" stroke="#EAE0D5" stroke-width="1.5"/>
    <rect x="8" y="8" width="64" height="60" rx="4" fill="#E8F4F8"/>
    <!-- 照片内部小风景 -->
    <path d="M 8 52 Q 28 36 44 48 Q 58 38 72 52 L 72 68 L 8 68 Z" fill="#B4D9C8"/>
    <circle cx="24" cy="24" r="7" fill="#FFC966"/>
  </g>

  <!-- 胶卷小盒子 -->
  <g transform="translate(270, 160) rotate(8)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="56" height="74" rx="8" fill="#F0E3D0" stroke="#C4A88E" stroke-width="1.8"/>
    <rect x="8" y="16" width="40" height="42" rx="4" fill="#3D3835"/>
    <circle cx="28" cy="37" r="10" fill="#E06941"/>
    <text x="28" y="40" font-size="7" font-family="sans-serif" font-weight="bold" fill="#FFF" text-anchor="middle">FILM</text>
  </g>

  <!-- 复古旁轴微单相机主体 -->
  <g transform="translate(110, 70)" filter="url(#cardShadow)">
    <!-- 相机背带挂扣 -->
    <path d="M 12 55 C -15 20, 205 20, 178 55" fill="none" stroke="#B08D72" stroke-width="4" stroke-linecap="round"/>
    <!-- 机身下半部（复古皮革蒙皮） -->
    <rect x="15" y="45" width="160" height="110" rx="14" fill="#4A4441" stroke="#363230" stroke-width="2"/>
    <rect x="15" y="45" width="160" height="30" fill="#E5DFD9" stroke="#363230" stroke-width="2" rx="6"/>
    <!-- 顶部操作旋钮与快门 -->
    <rect x="30" y="36" width="22" height="9" rx="3" fill="#C8BEB5" stroke="#363230" stroke-width="1.5"/>
    <rect x="135" y="38" width="18" height="7" rx="2" fill="#D8D0C7" stroke="#363230" stroke-width="1.5"/>
    <circle cx="160" cy="40" r="6" fill="#E76F51" stroke="#363230" stroke-width="1.5"/>

    <!-- 取景窗与测距窗 -->
    <rect x="35" y="52" width="14" height="10" rx="3" fill="#2B3A42" stroke="#4A4441" stroke-width="1"/>
    <circle cx="145" cy="57" r="5" fill="#FFEAA7" opacity="0.8"/>

    <!-- 镜头组件（多层质感圆环） -->
    <circle cx="95" cy="100" r="46" fill="#D3C9BF" stroke="#363230" stroke-width="2"/>
    <circle cx="95" cy="100" r="38" fill="#363230"/>
    <circle cx="95" cy="100" r="28" fill="#1F282D"/>
    <circle cx="95" cy="100" r="18" fill="#2E4A58"/>
    <!-- 镜头反光高光弧线 -->
    <path d="M 80 88 A 20 20 0 0 1 110 88" fill="none" stroke="#68C7C1" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="86" cy="94" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <!-- 红色标识点 (Leica style) -->
    <circle cx="145" cy="90" r="4.5" fill="#E76F51"/>
  </g>

  <!-- 旁边点缀的雏菊小花 -->
  <g transform="translate(65, 205)">
    <circle cx="15" cy="15" r="4" fill="#F4A261"/>
    <circle cx="15" cy="7" r="4" fill="#FFFFFF"/>
    <circle cx="21" cy="10" r="4" fill="#FFFFFF"/>
    <circle cx="21" cy="19" r="4" fill="#FFFFFF"/>
    <circle cx="15" cy="22" r="4" fill="#FFFFFF"/>
    <circle cx="9" cy="19" r="4" fill="#FFFFFF"/>
    <circle cx="9" cy="10" r="4" fill="#FFFFFF"/>
  </g>
</svg>
