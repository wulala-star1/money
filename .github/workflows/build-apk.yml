name: 打包 Android 原生 App (APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Gradle 自动化编译与签名 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 接受 Android SDK 协议并确保平台工具
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: 设置 Gradle 8.2 编译环境
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 编译并生成 APK
        run: |
          cd android
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace
          
          # 自动寻找编译出的 APK 并复制到根目录
          find . -name "*.apk" -exec cp {} ../piggy-save-release.apk \;
          cd ..
          ls -lh piggy-save-release.apk

      - name: 上传 APK 安装包至 GitHub 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: piggy-save-android-apk
          path: ./piggy-save-release.apk
          retention-days: 30

      - name: 发布至 GitHub Releases (方便手机直接扫码或点击下载)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-release
          name: 小猪存钱 Android App (v1.0.0)
          body: |
            ### 🐷 小猪存钱 · Android 安装包
            - **版本**：v1.0.0
            - **特性**：
              - 原生全屏体验，沉浸式手账质感
              - 支持 GitHub 云端无感热更新
              - 本地离线高速缓存
            
            直接点击下方 `piggy-save-release.apk` 即可下载安装到安卓手机！
          files: ./piggy-save-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
